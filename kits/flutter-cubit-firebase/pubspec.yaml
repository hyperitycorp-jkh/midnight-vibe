name: boilerplate
description: "A Flutter boilerplate app with AuthGate architecture"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  
  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Local packages
  common_utils:
    git:
      url: https://github.com/hyperitycorp/flutter_common.git
      path: common_utils
  firebase_utils:
    git:
      url: https://github.com/hyperitycorp/flutter_common.git
      path: firebase_utils
  
  # UI
  cupertino_icons: ^1.0.8
  
  # Utils
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true